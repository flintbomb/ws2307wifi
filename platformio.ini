; PlatformIO Project Configuration File
;
; Converted from Arduino IDE sketch "ws2307wifi"
; Original: DSP-7 Interface and Webpage (c) 2017 Helitron Electronics
;
; Build:    pio run
; Upload:   pio run -t upload
; Monitor:  pio device monitor
;
; Flash from Arduino IDE used 38400 baud serial; that's the application
; baud rate, not the upload baud rate. Upload speed below is for flashing.

[env:esp8266]
platform = espressif8266
board = esp07s
framework = arduino

; Original sketch talks to the DSP-7 over the hardware UART at 38400 baud.
;
monitor_speed = 38400
;monitor_speed = 74880

; Use a moderate upload speed; bump to 921600 if your USB-UART is reliable.
upload_speed = 921600
upload_port = COM5

; The original .ino code uses several patterns the modern toolchain rejects
; by default (assigning string literals to char*, missing returns, etc.).
; -fpermissive downgrades those errors to warnings so the unmodified code
; still compiles.
build_flags =
    '-DSTATIC_IP="10.69.69.12"'
    -fpermissive
    -Wno-write-strings
    -Wno-deprecated-declarations
    -Wno-return-type
    -Wno-unused-variable
    -Wno-unused-but-set-variable

lib_deps =
    links2004/WebSockets@^2.4.0

; -----------------------------------------------------------------------------
; OTA (over-the-air) upload environment.
;   pio run -e esp8266_ota -t upload
; Inherits everything from [env:esp8266] but uploads via WiFi instead of
; the serial port — useful for in-circuit flashing without disturbing the
; DSP-7 UART link. The ESP must already be running firmware that includes
; ArduinoOTA.begin() (the production env does, after the first flash).
; -----------------------------------------------------------------------------
[env:esp8266_ota]
extends = env:esp8266
upload_protocol = espota
upload_port = 10.69.69.145
; upload_flags = --auth=changeme    ; uncomment if OTA password is set
; OTA env compiles its own STATIC_IP. Inheriting build_flags doesn't work
; because PlatformIO reorders -D/-U so a late -U cancels an earlier -D;
; safer to list the flags explicitly and just change the IP literal.
build_flags =
    '-DSTATIC_IP="10.69.69.145"'
    -fpermissive
    -Wno-write-strings
    -Wno-deprecated-declarations
    -Wno-return-type
    -Wno-unused-variable
    -Wno-unused-but-set-variable