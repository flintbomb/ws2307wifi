; PlatformIO Project Configuration File
;
; Converted from Arduino IDE sketch "ws2307wifi"
; Original: DSP-7 Interface and Webpage (c) 2017 Helitron Electronics
;
; Build:    pio run
; Upload:   pio run -t upload
; Monitor:  pio device monitor
;
; Flash from Arduino IDE used 38400 baud serial; that's the application
; baud rate, not the upload baud rate. Upload speed below is for flashing.

[env:esp8266]
platform = espressif8266
board = huzzah
framework = arduino

; Original sketch talks to the DSP-7 over the hardware UART at 38400 baud.
;
monitor_speed = 38400
;monitor_speed = 74880

; Use a moderate upload speed; bump to 921600 if your USB-UART is reliable.
upload_speed = 921600
upload_port = COM5

; The original .ino code uses several patterns the modern toolchain rejects
; by default (assigning string literals to char*, missing returns, etc.).
; -fpermissive downgrades those errors to warnings so the unmodified code
; still compiles.
build_flags =
    -fpermissive
    -Wno-write-strings
    -Wno-deprecated-declarations
    -Wno-return-type
    -Wno-unused-variable
    -Wno-unused-but-set-variable
